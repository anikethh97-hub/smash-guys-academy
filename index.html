<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smash Guys Staff Academy</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;margin:0;color:#171717}.wrap{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #00000012}h1,h2{margin:0 0 8px}.muted{color:#666}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700;margin-top:9px}.btn.alt{background:#e9eaed;color:#111}.btn.danger{background:#b42318}.btn.small{width:auto;padding:9px 12px;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 9px;font-size:16px}textarea{min-height:80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;background:#f1f2f4;border-radius:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:5px 9px;border-radius:99px;background:#eee;font-size:12px;font-weight:700}.q{font-weight:700;font-size:18px}.opt{display:block;padding:13px;border:1px solid #ddd;border-radius:11px;margin:9px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.scroll{overflow:auto}.ok{color:#087f3e}.bad{color:#b42318}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.hidden{display:none}.notice{padding:11px;border-radius:10px;background:#fff7e6}.qedit{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.optionRow{display:flex;gap:6px;align-items:center}.optionRow input[type=text]{flex:1}.optionRow input[type=radio]{width:auto;margin:0}.right{text-align:right}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script>
const CONFIG={projectUrl:"https://ztezruennbxrybpyxrzm.supabase.co",publishableKey:"sb_publishable_KDKtTSATiqstDuIJQ2tYBg_QQBRkQUz",adminEmail:"anikethh97@gmail.com",adminPassword:"anik98765eth@1",passMark:70,attemptsTable:"exam_attempts_v7",questionsTable:"exam_questions_v7"};
const BANK=[
["Easy","What is mise en place?",["All ingredients, sauces, toppings, tools and packaging prepared before service","A customer complaint","A cooking temperature","A payment method"],0],
["Easy","What does 86 mean in service?",["An item or ingredient is unavailable","Extra cheese","A completed order","A table reservation"],0],
["Easy","What is the pass?",["Final quality-control point before the order leaves the kitchen","The staff entrance","The cash counter","The storage room"],0],
["Easy","Which ingredient is specifically flagged in the burger bun?",["Milk","Peanuts","Egg","Fish"],0],
["Easy","Which dessert is explicitly labelled as containing alcohol?",["Deep Fried Oreos","Old Monk Chocolate Mousse","Apple Crumble Cake","None"],1],
["Easy","Which burger is served with home-made jus?",["OG Smash","The Dalston Dip","Nashville Chicken","Magic Mushroom"],1],
["Easy","Which item is served with dino bone marrow?",["The Flintstone","OG Smash","Oklahoma Smash","BHR Braised Brisket"],0],
["Easy","What is a modifier?",["A customer change such as extra cheese or jalapeños","A staff roster","A cleaning chemical","A payment receipt"],0],
["Easy","Which side is served with roasted garlic mayo and a lemon wedge?",["Corn Ribs","Truffle Fries","Caesar Salad","Gravy Fries"],0],
["Easy","Which dessert is labelled eggless?",["Deep Fried Oreos","Apple Crumble Cake","Both","None"],0],
["Hard","Which components are in the OG Smash?",["Double smash patties, double American cheese, pickles, white onions and mustard","Chicken, Caesar dressing and parmesan","Brisket, Gruyère and truffle jam","Paneer, slaw and gochujang"],0],
["Hard","Which burger includes chimichurri, pickles, lettuce and smash sauce?",["Oklahoma Smash","OG Smash","PB & Bacon Smash","The Flintstone"],0],
["Hard","What is in the Chilli Cheese Smash?",["Double smash patties, chilli cheese sauce, American cheese, chilli sofrito and smash sauce","Chicken, buffalo sauce and lettuce","Brisket and jus","Mushroom patty and pickled onions"],0],
["Hard","Which burger contains crunchy peanut butter?",["PB & Bacon Smash","Bacon Chilli Cheese Smash","Alpine Truffle Smash","The Dalston Dip"],0],
["Hard","Which burger contains molten Gruyère and truffle onion jam?",["Alpine Truffle Smash","OG Smash","Louisiana","Nashville Chicken"],0],
["Hard","What is the correct build for The Flintstone?",["Smash patty, American cheese, streaky bacon, smash sauce, served with dino bone marrow","Double patties, double cheese and jus","Brisket, American cheese and smash sauce","Paneer, chimichurri and slaw"],0],
["Hard","Which side uses truffle mayo, Parmesan and parsley?",["Truffle Fries","Fries","Onion Rings","Corn Ribs"],0],
["Hard","Which side contains chicken stock according to the menu?",["Gravy Fries","Truffle Fries","Corn Ribs","Caesar Salad"],0],
["Hard","Which burger has pickled-onion smash patty and BBQ braised brisket?",["BHR Braised Brisket","The Dalston Dip","PB & Bacon Smash","Bacon Chilli Cheese Smash"],0],
["Hard","Which burger uses double white-onion smash patties?",["Oklahoma Smash","OG Smash","The Flintstone","Alpine Truffle Smash"],0],
["Hard","Which item contains gochujang glazed fried paneer?",["Korean Fried Paneer","Magic Mushroom","Louisiana","Nashville Chicken"],0],
["Hard","Which burger uses Nashville-spiced fried chicken, chilli sofrito, pickles and garlic aioli?",["Nashville Chicken","Buffalo Chicken","Crispy French Dip","Chicken Caesar Burger"],0],
["Tough","Which three menu items are flagged for egg?",["Nashville Chicken, Crispy French Dip and Chicken Caesar Burger","OG Smash, Fries and Corn Ribs","Magic Mushroom, Louisiana and Truffle Fries","PB & Bacon Smash, OG Smash and The Flintstone"],0],
["Tough","Which items are identified as containing nuts?",["Louisiana, Broccoli & Cheddar, PB & Bacon Smash, Apple Crumble Cake and Salted Pistachio Shake","OG Smash and Fries only","Nashville Chicken and Caesar Salad only","The Flintstone only"],0],
["Tough","A guest asks whether an item is safe for an allergy, but the menu does not establish safety. What should the staff member do?",["Guess based on experience","Check the approved allergen matrix/recipe card","Tell the guest it is probably safe","Ignore the request"],1],
["Tough","What is the correct allergen conversation sequence?",["Listen, Check, Confirm, Communicate, Prevent cross-contact","Check, Guess, Serve, Close, Clean","Listen, Serve, Confirm, Ignore, Pass","Order, Cook, Pack, Bill, Leave"],0],
["Tough","A modifier adds fried egg. What should the team member do?",["Identify the add-on and its allergen risk while retaining all base components","Remove the base cheese automatically","Ignore the modifier","Guess whether it is safe"],0],
["Tough","What must be checked before an order leaves the pass?",["Ticket, protein, cheese, sauce, toppings, texture, packaging, allergen and final visual","Only the bill","Only the burger bun","Only the table number"],0],
["Tough","Which item is a French-dip style fried chicken burger served with a separate French gravy dip?",["Crispy French Dip","Buffalo Chicken","Chicken Caesar Burger","Korean Fried Paneer"],0],
["Tough","Which side is made with crispy fried oyster mushroom and Japanese-style spice?",["Oyster Mushroom Karaage","Corn Ribs","Onion Rings","Gravy Fries"],0],
["Tough","Which side contains romaine, homemade dressing, croutons, marinated olives and sun-dried tomatoes?",["Caesar Salad","Corn Ribs","Truffle Fries","Fries"],0],
["Pro","A guest declares an allergen. What is the safest response when the menu does not establish the item is safe?",["Check the approved allergen matrix/recipe card and escalate uncertainty rather than guessing","Say it should be fine","Remove one topping and serve","Ask another guest"],0],
["Pro","During a busy service, a modified burger reaches the pass. The sauce is correct but one listed topping is missing. What is the correct action?",["Pass it because the rush is busy","Correct the item before hand-off","Ask the guest to add it later","Ignore the missing component"],1],
["Pro","A staff member knows a general recipe but not the approved house quantity. What should they do?",["Use a guessed quantity","Use the approved recipe card","Estimate by eye","Ask the guest"],1],
["Pro","Which statement best describes the difference between a menu build and an approved production recipe?",["The menu build lists components; exact weights and production parameters must come from approved recipe cards/SOPs","They are always identical","The menu build replaces all SOPs","Neither is needed"],0],
["Pro","A Crispy French Dip order has the burger correctly assembled but the separate gravy dip is missing. What should happen?",["Send it","Correct the missing dip before hand-off","Replace the burger","Ignore it"],1],
["Pro","Which quality check protects consistency and food cost?",["Portioning using the approved weight/count/measure every time","Guessing portions","Changing portions during peak hours","Skipping the recipe card"],0],
["Pro","A team member is unsure whether a mushroom item is a statutory major allergen in every jurisdiction. What does the manual instruct?",["Do not assume; the menu's mushroom category is reproduced but should not be treated as a universal statutory major-allergen category","Always call it a statutory major allergen everywhere","Ignore all mushroom information","Guess"],0]
];
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
const api=(path,opt={})=>fetch(CONFIG.projectUrl+path,{...opt,headers:{apikey:CONFIG.publishableKey,"Content-Type":"application/json",...(opt.headers||{})}});
let exam=[],answers={},timer=null,staff={},questions=[...BANK];
function home(){app.innerHTML=`<div class="card"><h1>Smash Guys Staff Academy</h1><p class="muted">Weekly Staff Knowledge Exam</p><button class="btn" onclick="staffForm()">Start Staff Exam</button><button class="btn alt" onclick="adminLogin()">Admin Dashboard</button></div><div class="card small"><b>Cloud:</b> <span id="cloud">Checking...</span></div>`;checkCloud()}
async function checkCloud(){try{let r=await api("/rest/v1/");document.getElementById("cloud").textContent=r.ok?"🟢 Connected":"🟠 API reachable but setup needed"}catch(e){document.getElementById("cloud").textContent="🔴 Cannot reach Supabase"}}
function staffForm(){app.innerHTML=`<div class="card"><h2>Staff Exam</h2><input id="staffName" placeholder="Full Name"><input id="staffId" placeholder="Employee ID"><input id="staffOutlet" placeholder="Outlet"><select id="staffLevel"><option value="all">Weekly mixed exam</option><option>Easy</option><option>Hard</option><option>Tough</option><option>Pro</option></select><button class="btn" onclick="startExam()">Start Exam</button><button class="btn alt" onclick="home()">Back</button></div>`}
async function startExam(){
 const n=document.getElementById("staffName"),id=document.getElementById("staffId"),o=document.getElementById("staffOutlet"),lv=document.getElementById("staffLevel");
 staff={name:n.value.trim(),employee_id:id.value.trim(),outlet:o.value.trim(),level:lv.value};
 if(!staff.name||!staff.employee_id||!staff.outlet){alert("Please enter Name, Employee ID and Outlet.");return}
 await loadQuestions(); let pool=staff.level==="all"?questions:questions.filter(q=>q[0]===staff.level);
 if(pool.length<12&&staff.level!=="all"){alert("Not enough questions in this level yet.");return}
 if(staff.level==="all"){let mix=["Easy","Hard","Tough","Pro"];exam=shuffle(mix.flatMap(l=>shuffle(questions.filter(q=>q[0]===l)).slice(0,3)));}else exam=shuffle(pool).slice(0,12);
 exam=exam.slice(0,12);answers={};clearInterval(timer);renderQ(0);let end=Date.now()+20*60*1000;timer=setInterval(()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000));let t=document.getElementById("timer");if(t)t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(s<=0)finish()},500)
}
async function loadQuestions(){try{let r=await api("/rest/v1/"+CONFIG.questionsTable+"?select=*&order=id.asc");if(r.ok){let rows=await r.json();if(rows.length)questions=rows.map(x=>[x.difficulty,x.question,[x.option_a,x.option_b,x.option_c,x.option_d],x.correct_index])}}catch(e){} }
let qi=0;function renderQ(i){qi=i;let q=exam[i];app.innerHTML=`<div class="card"><div class="top"><b>Question ${i+1}/${exam.length}</b><span id="timer" class="pill">20:00</span></div><p><span class="pill">${esc(q[0])}</span></p><div class="q">${esc(q[1])}</div>${q[2].map((x,j)=>`<label class="opt"><input type="radio" name="ans" value="${j}" ${answers[i]===j?"checked":""}> ${esc(x)}</label>`).join("")}<div class="top"><button class="btn alt" onclick="prev()" ${i===0?"disabled":""}>Previous</button><button class="btn" onclick="${i===exam.length-1?"finish()":"next()"}">${i===exam.length-1?"Submit":"Next"}</button></div></div>`}
function save(){let x=document.querySelector('input[name=ans]:checked');if(x)answers[qi]=Number(x.value)}function next(){save();renderQ(qi+1)}function prev(){save();renderQ(qi-1)}
async function finish(){save();if(!exam.length)return;clearInterval(timer);let score=exam.reduce((n,q,i)=>n+(answers[i]===q[3]?1:0),0),pct=Math.round(score/exam.length*100),pass=pct>=CONFIG.passMark;let payload={name:staff.name,employee_id:staff.employee_id,outlet:staff.outlet,score,percentage:pct,passed:pass,level:staff.level,answers,submitted_at:new Date().toISOString()};let saved=false;try{let r=await api("/rest/v1/"+CONFIG.attemptsTable,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});saved=r.ok}catch(e){}app.innerHTML=`<div class="card"><h1>${pass?"🎉 Passed":"Exam Completed"}</h1><div class="grid"><div class="stat"><b>Score</b><br>${score}/${exam.length}</div><div class="stat"><b>Percentage</b><br>${pct}%</div></div><p class="${pass?"ok":"bad"}"><b>${pass?"PASS":"FAIL"}</b></p><p class="muted">${saved?"Result saved to cloud.":"Result could not be saved. Please inform the admin."}</p><button class="btn" onclick="home()">Done</button></div>`}
function adminLogin(){app.innerHTML=`<div class="card"><h2>Admin Login</h2><input id="adminEmail" type="email" placeholder="Admin email"><input id="adminPass" type="password" placeholder="Password"><button class="btn" onclick="loginAdmin()">Login</button><button class="btn alt" onclick="home()">Back</button></div>`}
function loginAdmin(){let e=document.getElementById("adminEmail").value.trim(),p=document.getElementById("adminPass").value;if(e===CONFIG.adminEmail&&p===CONFIG.adminPassword){dashboard()}else alert("Incorrect admin email or password.")}
async function dashboard(){app.innerHTML=`<div class="card"><div class="top"><h2>Admin Dashboard</h2><span class="pill">ADMIN</span></div><p class="muted">Results, question bank and exam controls</p><div class="tabs"><button class="btn small" onclick="resultsTab()">Results</button><button class="btn small" onclick="questionsTab()">Question Bank</button><button class="btn small" onclick="addQuestion()">+ Add Question</button></div><div id="adminBody"><p>Loading...</p></div><button class="btn alt" onclick="home()">Logout</button></div>`;resultsTab()}
async function resultsTab(){let b=document.getElementById("adminBody");b.innerHTML="<p>Loading results...</p>";try{let r=await api("/rest/v1/"+CONFIG.attemptsTable+"?select=*&order=submitted_at.desc");if(!r.ok)throw Error("HTTP "+r.status);let rows=await r.json();b.innerHTML=`<div class="grid"><div class="stat"><b>Attempts</b><br>${rows.length}</div><div class="stat"><b>Pass rate</b><br>${rows.length?Math.round(rows.filter(x=>x.passed).length/rows.length*100):0}%</div></div><div class="scroll"><table class="table"><tr><th>Name</th><th>ID</th><th>Outlet</th><th>Score</th><th>Result</th><th>Date</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.employee_id)}</td><td>${esc(x.outlet)}</td><td>${x.score}/${x.level==="all"?12:"12"} (${x.percentage}%)</td><td>${x.passed?"PASS":"FAIL"}</td><td>${new Date(x.submitted_at).toLocaleString()}</td></tr>`).join("")}</table></div>`}catch(e){b.innerHTML=`<p class="bad">${esc(e.message)}<br>Run the V7 SQL setup.</p>`}}
function questionsTab(){let b=document.getElementById("adminBody");b.innerHTML=`<div class="notice">Edit questions below. Changes are saved to this admin device and can also be uploaded to Supabase after setup.</div>${questions.map((q,i)=>questionEditor(q,i)).join("")}`}
function questionEditor(q,i){return `<div class="qedit"><div class="top"><b>${i+1}. ${esc(q[0])}</b><button class="btn small danger" onclick="deleteQuestion(${i})">Delete</button></div><select id="d${i}"><option ${q[0]==="Easy"?"selected":""}>Easy</option><option ${q[0]==="Hard"?"selected":""}>Hard</option><option ${q[0]==="Tough"?"selected":""}>Tough</option><option ${q[0]==="Pro"?"selected":""}>Pro</option></select><textarea id="q${i}">${esc(q[1])}</textarea>${q[2].map((x,j)=>`<div class="optionRow"><input type="radio" name="correct${i}" ${q[3]===j?"checked":""} value="${j}"><input id="o${i}_${j}" type="text" value="${esc(x)}"></div>`).join("")}<button class="btn" onclick="saveQuestion(${i})">Save Question</button></div>`}
function saveQuestion(i){let q=[document.getElementById("d"+i).value,document.getElementById("q"+i).value.trim(),[0,1,2,3].map(j=>document.getElementById(`o${i}_${j}`).value.trim()),Number(document.querySelector(`input[name=correct${i}]:checked`).value)];if(!q[1]||q[2].some(x=>!x)){alert("Complete the question and all four options.");return}questions[i]=q;localStorage.setItem("smashGuysQuestions",JSON.stringify(questions));alert("Question saved on this device.");questionsTab()}
function deleteQuestion(i){if(questions.length<=12){alert("Keep at least 12 questions.");return}if(confirm("Delete this question?")){questions.splice(i,1);localStorage.setItem("smashGuysQuestions",JSON.stringify(questions));questionsTab()}}
function addQuestion(){questions.push(["Easy","New question",["Option A","Option B","Option C","Option D"],0]);questionsTab()}
(function(){try{let x=JSON.parse(localStorage.getItem("smashGuysQuestions"));if(Array.isArray(x)&&x.length)questions=x}catch(e){}home()})();
</script></body></html>
